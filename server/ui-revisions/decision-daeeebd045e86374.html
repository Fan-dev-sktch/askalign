<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;font:12px/1.45 system-ui,"Microsoft YaHei",sans-serif;--gm-blue:light-dark(#1976d2,#59aaff);--gm-panel:light-dark(#fafbfc,#202125);--gm-muted:light-dark(#626971,#a9afb8);--gm-border:light-dark(#dce1e6,#3b4149);--gm-selected:color-mix(in srgb,var(--gm-blue) 9%,var(--gm-panel))}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:0;background:transparent;color:CanvasText}.card{width:100%;max-width:760px;border:1px solid var(--gm-border);border-radius:12px;padding:8px 8px;background:var(--gm-panel)}.meta{color:var(--gm-muted);font-size:12px;margin-bottom:8px}h2{font-size:13px;line-height:1.45;font-weight:500;margin:0 0 8px}.option{display:flex;gap:8px;align-items:flex-start;border:0;border-bottom:1px solid var(--gm-border);padding:6px 0;min-height:40px;margin:0;cursor:pointer}.option:last-child{border-bottom:0}.option:hover,.option:focus-within{background:color-mix(in srgb,CanvasText 4%,var(--gm-panel))}.option:has(input:checked){background:var(--gm-selected)}.option input{margin:4px 0 0;accent-color:var(--gm-blue)}.option-copy{flex:1;min-width:0}.label{font-size:12px;font-weight:400}.hint{color:var(--gm-muted);font-size:12px;font-weight:400}.desc{font-size:11px;color:var(--gm-muted);margin-top:2px}.free{display:block;width:100%;min-height:24px;padding:0;margin:0;border:0;font:inherit;background:transparent;color:CanvasText;resize:vertical}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.actions{display:flex;gap:8px;align-items:center}.status{font-size:12px;color:var(--gm-muted)}button{font:inherit;min-height:34px;padding:6px 12px;border-radius:6px;cursor:pointer}.back{border:1px solid var(--gm-border);background:transparent;color:CanvasText}.next{border:0;background:var(--gm-blue);color:light-dark(#fff,#10161e)}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid var(--gm-blue);outline-offset:2px}
.card[data-complete]{padding:4px 10px;border-color:transparent;background:transparent}
.card[data-complete] h2{font-size:12px;line-height:1.3;font-weight:400;margin:0;color:var(--gm-muted)}
.receipt{font-size:12px;color:var(--gm-muted)}.receipt summary{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:24px}.receipt div{padding:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
/* MCP Apps host tokens take precedence; fallback values support older hosts. */
:root{font-family:var(--font-sans,system-ui,"Microsoft YaHei",sans-serif);font-size:var(--font-text-md-size,12px);line-height:var(--font-text-md-line-height,1.45);font-weight:var(--font-weight-normal,400);--gm-blue:var(--color-text-info,light-dark(#1976d2,#59aaff));--gm-panel:var(--color-background-primary,light-dark(#fafbfc,#202125));--gm-muted:var(--color-text-secondary,light-dark(#626971,#a9afb8));--gm-border:var(--color-border-primary,light-dark(#dce1e6,#3b4149));--gm-selected:var(--color-background-secondary,color-mix(in srgb,var(--gm-blue) 9%,var(--gm-panel)))}
/* Paint the iframe canvas too: transparent content with color-scheme can expose
   the browser's dark canvas instead of the surrounding conversation surface. */
html,body{background-color:var(--color-background-primary,light-dark(#ffffff,#181818))}
body{color:var(--color-text-primary,CanvasText)}.card{border-radius:var(--border-radius-lg,12px);border-width:var(--border-width-regular,1px)}
h2{font-size:1em;line-height:inherit;font-weight:var(--font-weight-medium,500)}.label,.hint,.meta,.status,.receipt,.card[data-complete] h2{font-size:1em}.label,.hint{font-weight:inherit}.desc{font-size:var(--font-text-sm-size,.92em);line-height:var(--font-text-sm-line-height,inherit)}
button{border-radius:var(--border-radius-md,6px)}.next{background:var(--color-background-inverse,var(--gm-blue));color:var(--color-text-inverse,light-dark(#fff,#10161e))}.receipt summary{line-height:inherit;padding:3px 0}:focus-visible{outline-color:var(--color-ring-primary,var(--gm-blue))}
@media (max-width:480px),(pointer:coarse){
  .card{max-width:100%}.option{min-height:44px;padding:10px 0;gap:10px}.option input{width:18px;height:18px;flex-shrink:0}
  button,.receipt summary{min-height:44px}.receipt summary{display:flex;align-items:center}.free{font-size:max(16px,1em);min-height:44px}
  h2,.label,.desc{overflow-wrap:anywhere}.footer{flex-wrap:wrap}.actions{margin-left:auto}button{touch-action:manipulation}
}
</style></head><body><section class="card" aria-labelledby="question"><div class="meta" id="progress">正在载入问题…</div><h2 id="question"></h2><div id="options"></div><textarea id="free" class="free" aria-label="其他想法" placeholder="直接在这个选项里写下你的想法" hidden></textarea><div class="footer"><span class="status" id="status" aria-live="polite"></span><div class="actions"><button id="back" class="back" type="button">返回</button><button id="next" class="next" type="button">下一题</button></div></div></section>
<script>
const progressEl=document.getElementById('progress'),questionEl=document.getElementById('question'),optionsEl=document.getElementById('options'),freeEl=document.getElementById('free'),backEl=document.getElementById('back'),nextEl=document.getElementById('next'),statusEl=document.getElementById('status'),footerEl=document.querySelector('.footer');
const pending=new Map();let serial=1,decisionId='',questions=[],answers=[],page=0,sent=false,sending=false,deliveryUncertain=false,sizePending=false,lastWidth=-1,lastHeight=-1;
let locale='zh-CN';
const translations={
  'zh-CN':{loading:'正在载入问题…',used:'已完成',progress:(page,total)=>`${page} / ${total}`,back:'返回',next:'下一题',continue:'继续',check:'请查看对话',uncertain:'未收到发送确认，请勿重复提交',retry:'重试',recorded:'已记录',custom:'其他',customLabel:'其他想法',customPlaceholder:'在这里写',recommended:' · 推荐',separator:'、',done:'',required:'请选择或填写',sending:'正在继续…',failed:'发送失败，请重试',prompt:answer=>`我的选择：${answer}。请继续。`},
  en:{loading:'Loading questions…',used:'Done',progress:(page,total)=>`${page} / ${total}`,back:'Back',next:'Next',continue:'Continue',check:'Check the conversation',uncertain:'Delivery is unconfirmed. Do not send again.',retry:'Retry',recorded:'Recorded',custom:'Other',customLabel:'Other answer',customPlaceholder:'Write here',recommended:' · Recommended',separator:', ',done:'',required:'Choose or enter an answer',sending:'Continuing…',failed:'Could not send. Please retry.',prompt:answer=>`My choices: ${answer}. Please continue.`}
};
const t=()=>translations[locale]||translations.en;
function applyHostContext(context){
  if(!context||typeof context!=='object')return;
  const root=document.documentElement;
  if(['light','dark'].includes(context.theme)){root.style.colorScheme=context.theme;root.dataset.theme=context.theme;}
  const variables=context.styles?.variables;
  if(variables&&typeof variables==='object')for(const [key,value] of Object.entries(variables)){
    if(!/^--(?:color-|font-|border-|shadow-)[a-z0-9-]+$/.test(key))continue;
    if(typeof value==='string')root.style.setProperty(key,value);else if(value===null)root.style.removeProperty(key);
  }
  const fonts=context.styles?.css?.fonts;
  if(typeof fonts==='string'){
    let style=document.getElementById('host-fonts');if(!style){style=document.createElement('style');style.id='host-fonts';document.head.append(style);}style.textContent=fonts;
  }
  notifySize();
}
const receiptEl=document.createElement('details');receiptEl.className='receipt';receiptEl.hidden=true;questionEl.after(receiptEl);receiptEl.addEventListener('toggle',notifySize);
function renderReceipt(){
  receiptEl.hidden=!sent;questionEl.hidden=sent;
  if(!sent){receiptEl.replaceChildren();return;}
  const summary=document.createElement('summary');
  summary.textContent=`${t().recorded}：${questions.map((q,i)=>choiceText(q,answers[i])).join('；')}`;
  summary.title=summary.textContent;receiptEl.replaceChildren(summary);
  questions.forEach((q,i)=>{const line=document.createElement('div');line.textContent=`${q.question}\n${choiceText(q,answers[i])}`;receiptEl.append(line);});
}
function complete(i){const a=answers[i];return a.picks.length>0&&(!a.picks.includes(questions[i].options.length)||a.custom.trim().length>0);}
function request(method,params){
  const id=serial++;
  return new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{
      pending.delete(id);
      const error=new Error('Host response timed out');
      error.uncertain=method==='ui/message';
      reject(error);
    },15000);
    pending.set(id,{resolve:value=>{clearTimeout(timer);resolve(value);},reject:error=>{clearTimeout(timer);reject(error);}});
    window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
  });
}
function choiceText(item,answer){const labels=answer.picks.map(i=>item.options[i]?.label).filter(Boolean);if(answer.picks.includes(item.options.length)&&answer.custom.trim())labels.push(answer.custom.trim());return labels.join(t().separator);}
function notifySize(){
  if(window.parent===window||sizePending)return;
  sizePending=true;
  requestAnimationFrame(()=>{
    sizePending=false;
    const html=document.documentElement,originalHeight=html.style.height;
    html.style.height='max-content';
    const height=Math.ceil(html.getBoundingClientRect().height),width=Math.ceil(window.innerWidth);
    html.style.height=originalHeight;
    if(height>0&&(width!==lastWidth||height!==lastHeight)){
      lastWidth=width;lastHeight=height;
      window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{width,height}},'*');
    }
  });
}
function persist(){try{window.openai?.setWidgetState?.({modelContent:sent?{decisionId,status:'used',answers:questions.map((item,i)=>choiceText(item,answers[i]))}:{decisionId,status:deliveryUncertain?'unconfirmed':'pending'},privateContent:{decisionId,answers,page,sent,deliveryUncertain}});}catch{}}
function render(){if(!questions.length)return;const c=t(),done=page>=questions.length||sent;document.querySelector('.card').toggleAttribute('data-complete',sent);document.documentElement.lang=locale;freeEl.setAttribute('aria-label',c.customLabel);freeEl.placeholder=c.customPlaceholder;backEl.textContent=c.back;progressEl.textContent=sent?c.used:done?c.progress(questions.length,questions.length):c.progress(page+1,questions.length);progressEl.hidden=questions.length===1||sent;backEl.hidden=page===0||sent||sending||deliveryUncertain;backEl.disabled=sent||sending||deliveryUncertain;nextEl.hidden=sent||sending||deliveryUncertain||!done&&!questions[page]?.multiple&&!answers[page]?.picks.includes(questions[page]?.options.length);nextEl.textContent=done?c.retry:page===questions.length-1?c.continue:c.next;optionsEl.replaceChildren();freeEl.value='';statusEl.textContent=deliveryUncertain?c.uncertain:'';footerEl.hidden=backEl.hidden&&nextEl.hidden&&!statusEl.textContent;
  nextEl.disabled=false;renderReceipt();notifySize();
  if(done){questionEl.textContent=sent?c.recorded:deliveryUncertain?c.check:sending?c.sending:c.failed;return;}
  const item=questions[page],answer=answers[page];questionEl.textContent=item.question;item.options.forEach((opt,i)=>addOption(opt.label,opt.description,i,item.multiple,i===item.recommendedIndex,answer.picks.includes(i)));addOption(c.custom,'',item.options.length,item.multiple,false,answer.picks.includes(item.options.length));freeEl.value=answer.custom;}
function advance(){page++;persist();if(page===questions.length)void submitAnswers();else render();}
function addOption(label,description,index,multiple,recommended,checked){
  const custom=index===questions[page].options.length;
  const row=document.createElement(custom?'div':'label');row.className='option';
  const input=document.createElement('input');input.type=multiple?'checkbox':'radio';input.name='choice';input.value=String(index);input.checked=checked;input.setAttribute('aria-label',label);
  const words=document.createElement('span'),title=document.createElement('span');words.className='option-copy';title.className='label';title.textContent=label;
  if(recommended){const note=document.createElement('span');note.className='hint';note.textContent=t().recommended;title.append(note);}words.append(title);
  if(description){const desc=document.createElement('div');desc.className='desc';desc.textContent=description;words.append(desc);}
  if(custom){freeEl.hidden=!checked;title.hidden=checked;words.append(freeEl);}
  row.append(input,words);optionsEl.append(row);
  if(custom)row.addEventListener('click',event=>{if(event.target===input||event.target===freeEl)return;if(!input.checked)input.click();else freeEl.focus();});
  input.addEventListener(multiple?'change':'click',()=>{
    if(sent||sending||deliveryUncertain)return;
    const item=questions[page],answer=answers[page];
    if(item.multiple){
      answer.picks=[...optionsEl.querySelectorAll('input:checked')].map(node=>Number(node.value));
      if(custom){freeEl.hidden=!input.checked;title.hidden=input.checked;if(input.checked)freeEl.focus();}
      statusEl.textContent='';persist();return;
    }
    answer.picks=[index];
    if(custom){persist();render();freeEl.focus();return;}advance();
  });
}
function next(){if(sent||sending||deliveryUncertain)return;if(page===questions.length){void submitAnswers();return;}const item=questions[page],answer=answers[page];if(!item)return;if(answer.picks.includes(item.options.length))answer.custom=freeEl.value.trim();if(!answer.picks.length||answer.picks.includes(item.options.length)&&!answer.custom){statusEl.textContent=t().required;return;}advance();}
async function submitAnswers(){
  if(sent||sending||deliveryUncertain||page!==questions.length||!questions.every((_,i)=>complete(i)))return;
  sending=true;render();
  const answer=questions.map((item,i)=>locale==='zh-CN'?`「${item.question}」：${choiceText(item,answers[i])}`:`“${item.question}”: ${choiceText(item,answers[i])}`).join(locale==='zh-CN'?'；':'; ');
  try{
    const prompt=t().prompt(answer);
    const saved=await request('tools/call',{name:'grill_me_submit_answer',arguments:{decisionId,answers:answers.map((a,i)=>({picks:a.picks,custom:a.picks.includes(questions[i].options.length)?a.custom.trim():''}))}});
    if(saved?.isError||saved?.structuredContent?.saved!==true||saved?.structuredContent?.decisionId!==decisionId)throw new Error('Answer could not be saved');
    const result=await request('ui/message',{role:'user',content:[{type:'text',text:prompt}]});
    if(result?.isError)throw new Error('Host rejected message');
    sent=true;
  }catch(error){deliveryUncertain=error?.uncertain===true;}
  finally{sending=false;persist();render();if(!sent&&!deliveryUncertain)statusEl.textContent=t().failed;}
  // Keep an inline receipt instead of closing the host widget and reopening it.
}
function load(data){
  if(!data?.decisionId)return;
  const raw=Array.isArray(data.questions)?data.questions:data.question&&Array.isArray(data.options)?[data]:[];
  if(!raw.length||raw.some(item=>typeof item.question!=='string'||!Array.isArray(item.options)||item.options.length<2||item.options.some(opt=>typeof opt.label!=='string')))return;
  const id=data.decisionId;if(id===decisionId&&questions.length)return;
  decisionId=id;locale=data.locale==='zh-CN'||data.locale==='en'?data.locale:/[\u3400-\u9fff]/u.test(raw[0].question)?'zh-CN':'en';
  questions=raw.map(item=>({...item,multiple:Boolean(item.multiple),recommendedIndex:Math.min(item.recommendedIndex??0,item.options.length-1)}));
  const saved=window.openai?.widgetState?.privateContent;
  const restore=Boolean(saved?.decisionId===id&&Array.isArray(saved.answers)&&saved.answers.length===questions.length&&saved.answers.every((answer,i)=>Array.isArray(answer?.picks)&&typeof answer.custom==='string'&&answer.picks.every(pick=>Number.isInteger(pick)&&pick>=0&&pick<=questions[i].options.length)&&(questions[i].multiple||answer.picks.length<=1)));
  answers=restore?saved.answers:questions.map(()=>({picks:[],custom:''}));
  page=restore?Math.min(Math.max(0,Number(saved.page)||0),questions.length):0;
  sent=restore&&saved.sent===true;deliveryUncertain=restore&&saved.deliveryUncertain===true;sending=false;render();if(!restore)persist();
}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const msg=event.data;if(msg?.jsonrpc!=='2.0')return;if(msg.id!==undefined&&pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);msg.error?p.reject(msg.error):p.resolve(msg.result);return;}if(msg.method==='ui/notifications/tool-result')load(msg.params?.structuredContent);if(msg.method==='ui/notifications/host-context-changed')applyHostContext(msg.params);});
load(window.openai?.toolOutput?.structuredContent||window.openai?.toolOutput);
if(window.parent!==window){request('ui/initialize',{appInfo:{name:'askalign',title:'AskAlign',version:'0.4.0-beta.1'},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'}).then(result=>{applyHostContext(result?.hostContext);window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');notifySize();}).catch(()=>{});}
if(window.ResizeObserver){const resizeObserver=new ResizeObserver(notifySize);resizeObserver.observe(document.documentElement);resizeObserver.observe(document.body);}
backEl.addEventListener('click',()=>{if(page>0&&!sent&&!sending&&!deliveryUncertain){if(page<questions.length&&answers[page].picks.includes(questions[page].options.length))answers[page].custom=freeEl.value;page--;persist();render();}});
nextEl.addEventListener('click',next);
freeEl.addEventListener('input',()=>{if(page<questions.length)answers[page].custom=freeEl.value;statusEl.textContent='';persist();});
freeEl.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.altKey&&!event.isComposing){event.preventDefault();next();}});
freeEl.addEventListener('focus',()=>{if(sent||sending||page>=questions.length)return;const item=questions[page],answer=answers[page],index=item.options.length;if(!answer.picks.includes(index)){answer.picks=item.multiple?[...answer.picks,index]:[index];const radio=optionsEl.querySelector(`input[value="${index}"]`);if(radio)radio.checked=true;nextEl.hidden=false;footerEl.hidden=false;persist();}});
</script></body></html>
