</style></head><body><section class="card" aria-labelledby="question"><div class="meta" id="progress">正在载入问题…</div><h2 id="question"></h2><div id="options"></div><textarea id="free" class="free" aria-label="其他想法" placeholder="直接在这个选项里写下你的想法" hidden></textarea><div class="footer"><span class="status" id="status" aria-live="polite"></span><div class="actions"><button id="back" class="back" type="button">返回</button><button id="next" class="next" type="button">下一题</button></div></div></section>
<script>
const progressEl=document.getElementById('progress'),questionEl=document.getElementById('question'),optionsEl=document.getElementById('options'),freeEl=document.getElementById('free'),backEl=document.getElementById('back'),nextEl=document.getElementById('next'),statusEl=document.getElementById('status'),footerEl=document.querySelector('.footer');
const pending=new Map();let serial=1,decisionId='',questions=[],answers=[],page=0,sent=false,sending=false,sizePending=false,lastWidth=-1,lastHeight=-1;

async function checkStatus(){

window.addEventListener('pagehide',()=>{clearTimeout(statusTimer);statusTimer=null;});
window.addEventListener('pageshow',()=>{void checkStatus();});
const translations={
  'zh-CN':{loading:'正在载入问题…',used:'已完成',progress:(page,total)=>`${page} / ${total}`,back:'返回',next:'下一题',continue:'继续',check:'请查看对话',checking:'保存未确认，正在核对…',retry:'重试',recorded:'已记录',custom:'其他',customLabel:'其他想法',customPlaceholder:'在这里写',recommended:' · 推荐',separator:'、',done:'',required:'请选择或填写',sending:'正在继续…',failed:'保存未确认，请重试'},
  en:{loading:'Loading questions…',used:'Done',progress:(page,total)=>`${page} / ${total}`,back:'Back',next:'Next',continue:'Continue',check:'Check the conversation',checking:'Save unconfirmed, checking…',retry:'Retry',recorded:'Recorded',custom:'Other',customLabel:'Other answer',customPlaceholder:'Write here',recommended:' · Recommended',separator:', ',done:'',required:'Choose or enter an answer',sending:'Continuing…',failed:'Save unconfirmed. Please retry.'}
};
const t=()=>translations[locale]||translations.en;
function applyHostContext(context){
  if(!context||typeof context!=='object')return;
  const root=document.documentElement;
  if(['light','dark'].includes(context.theme)){root.style.colorScheme=context.theme;root.dataset.theme=context.theme;}
  const variables=context.styles?.variables;
  if(variables&&typeof variables==='object')for(const [key,value] of Object.entries(variables)){
    if(!/^--(?:color-|font-|border-|shadow-)[a-z0-9-]+$/.test(key))continue;
    if(typeof value==='string')root.style.setProperty(key,value);else if(value===null)root.style.removeProperty(key);

  if(typeof fonts==='string'){
    let style=document.getElementById('host-fonts');if(!style){style=document.createElement('style');style.id='host-fonts';document.head.append(style);}style.textContent=fonts;
  }

}
const receiptEl=document.createElement('details');receiptEl.className='receipt';receiptEl.hidden=true;questionEl.after(receiptEl);receiptEl.addEventListener('toggle',()=>{updateToolsVisibility();notifySize();});
function renderReceipt(){
  receiptEl.hidden=!sent;questionEl.hidden=sent;
  if(!sent){receiptSignature='';receiptEl.replaceChildren();return;}
  const signature=JSON.stringify({decisionId,locale,answers,acknowledgement,revision});if(signature===receiptSignature)return;receiptSignature=signature;
  const summary=document.createElement('summary');
  summary.textContent=acknowledgement?ux().acknowledged:ux().awaiting;
  summary.title=summary.textContent;receiptEl.replaceChildren(summary);
  questions.forEach((q,i)=>{const line=document.createElement('div');line.textContent=`${q.question}\n${choiceText(q,answers[i])}`;receiptEl.append(line);});
  if(acknowledgement){const note=document.createElement('p');note.className='delivery';note.textContent=ux().nextStep+acknowledgement.nextStep;receiptEl.append(note);}
  const edit=document.createElement('button');edit.type='button';edit.className='back';edit.textContent=ux().edit;edit.addEventListener('click',startEdit);receiptEl.append(edit);
  const note=document.createElement('p');note.className='panel-note';note.textContent=ux().editNote;receiptEl.append(note);
}
function complete(i){const a=answers[i];return a.picks.length>0&&(!a.picks.includes(questions[i].options.length)||a.custom.trim().length>0);}
function request(method,params){
  const id=serial++;

    const timer=setTimeout(()=>{
      pending.delete(id);
      const error=new Error('Host response timed out');error.code='TIMEOUT';
      reject(error);

function choiceText(item,answer){const labels=answer.picks.map(i=>item.options[i]?.label).filter(Boolean);if(answer.picks.includes(item.options.length)&&answer.custom.trim())labels.push(answer.custom.trim());return labels.join(t().separator);}

  if(window.parent===window||sizePending)return;

  requestAnimationFrame(()=>{
    sizePending=false;
    const html=document.documentElement,originalHeight=html.style.height;
    html.style.height='max-content';
    const height=dismissed?1:Math.ceil(html.getBoundingClientRect().height),width=Math.ceil(window.innerWidth);

    }

function persist(){try{window.openai?.setWidgetState?.({modelContent:dismissed?{decisionId,status:'dismissed'}:sent?{decisionId,status:'used',answers:questions.map((item,i)=>choiceText(item,answers[i]))}:{decisionId,status:'pending'},privateContent:{decisionId,answers,page,sent,dismissed,revision,editing,editBase,editRequestId,savedLocally,storedAnswers,acknowledgement}});}catch{}}
function render(){if(dismissed){hideDismissed();return;}if(!questions.length)return;const c=t(),done=page>=questions.length||sent;document.querySelector('.card').toggleAttribute('data-complete',sent);document.documentElement.lang=locale;freeEl.setAttribute('aria-label',c.customLabel);freeEl.placeholder=c.customPlaceholder;backEl.textContent=c.back;progressEl.textContent=sent?c.used:done?c.progress(questions.length,questions.length):c.progress(page+1,questions.length);progressEl.hidden=questions.length===1||sent;backEl.hidden=page===0||sent||sending;backEl.disabled=sent||sending;nextEl.hidden=sent||sending||!done&&!questions[page]?.multiple&&!answers[page]?.picks.includes(questions[page]?.options.length);nextEl.textContent=done&&editing?ux().saveEdit:done?c.retry:page===questions.length-1?c.continue:c.next;optionsEl.replaceChildren();freeEl.value='';statusEl.textContent='';footerEl.hidden=backEl.hidden&&nextEl.hidden&&!statusEl.textContent;
  nextEl.disabled=false;renderReceipt();renderExtras();notifySize();
  if(done){questionEl.textContent=sent?c.recorded:editing&&!sending?ux().reviewEdit:sending?c.sending:c.failed;return;}
  const item=questions[page],answer=answers[page];questionEl.textContent=item.question;item.options.forEach((opt,i)=>addOption(opt.label,opt.description,i,item.multiple,i===item.recommendedIndex,answer.picks.includes(i)));addOption(c.custom,'',item.options.length,item.multiple,false,answer.picks.includes(item.options.length));freeEl.value=answer.custom;}

function addOption(label,description,index,multiple,recommended,checked){
  const custom=index===questions[page].options.length;
  const row=document.createElement(custom?'div':'label');row.className='option';
  const input=document.createElement('input');input.type=multiple?'checkbox':'radio';input.name='choice';input.value=String(index);input.checked=checked;input.setAttribute('aria-label',label);

  if(recommended){const note=document.createElement('span');note.className='hint';note.textContent=t().recommended;title.append(note);}words.append(title);
  if(description){const desc=document.createElement('div');desc.className='desc';desc.textContent=description;words.append(desc);}

  row.append(input,words);optionsEl.append(row);

    if(dismissed||sent||sending)return;
    const item=questions[page],answer=answers[page];
    if(item.multiple){
      answer.picks=[...optionsEl.querySelectorAll('input:checked')].map(node=>Number(node.value));
      if(custom){freeEl.hidden=!input.checked;title.hidden=input.checked;if(input.checked)freeEl.focus();}

function next(){if(dismissed||sent||sending)return;if(page===questions.length){void submitAnswers();return;}const item=questions[page],answer=answers[page];if(!item)return;if(answer.picks.includes(item.options.length))answer.custom=freeEl.value.trim();if(!answer.picks.length||answer.picks.includes(item.options.length)&&!answer.custom){statusEl.textContent=t().required;return;}advance();}
async function submitAnswers(){

    const saved=await request('tools/call',{name:editing?'spellout_revise_answer':'spellout_submit_answer',arguments:{decisionId,answers:answers.map((a,i)=>({picks:a.picks,custom:a.picks.includes(questions[i].options.length)?a.custom.trim():''})),...(editing?{expectedRevision:editBase,requestId:editRequestId}:{})}});

function load(data){

  decisionId=id;locale=data.locale==='zh-CN'||data.locale==='en'?data.locale:/[\u3400-\u9fff]/u.test(raw[0].question)?'zh-CN':'en';

  const restore=Boolean(saved?.decisionId===id&&Array.isArray(saved.answers)&&saved.answers.length===questions.length&&saved.answers.every((answer,i)=>Array.isArray(answer?.picks)&&typeof answer.custom==='string'&&answer.picks.every(pick=>Number.isInteger(pick)&&pick>=0&&pick<=questions[i].options.length)&&(questions[i].multiple||answer.picks.length<=1)));

const uiText={
 'zh-CN':{awaiting:'待读取',acknowledged:'已完成',nextStep:'接下来：',edit:'修改选择',editNote:'修改会保存为新答案，供助手读取；已执行的操作不会自动撤销。',saveEdit:'保存修改',reviewEdit:'确认并保存修改',cancelEdit:'取消修改',saving:'正在保存选择…',brief:'我的需求摘要',settings:'提问设置',goal:'要达成什么',confirmed:'已确定的要求',open:'还没弄清的地方',empty:'尚未整理，可直接补充',apply:'应用到本次任务',saveBrief:'保存摘要',defaults:'另存为长期默认',scope:'默认只影响当前任务。切换档位会重置下面的细分设置。',preview:'提问方式示例（预览）',saved:'已保存到本次任务',defaultSaved:'已保存为长期默认',saveFailed:'保存失败，草稿仍保留。请重试；若其他窗口已修改，先重新载入。',reload:'重新载入（放弃草稿）',saveFirst:'请先应用到本次任务，再另存为默认。',working:'正在保存…',why:'为什么问：',preset:'提问档位',coverage:'覆盖范围',depth:'追问深度',frequency:'提问频率',diversity:'问题多样性',challenge:'质疑程度',questionsPerRound:'每轮最多几题'},
 en:{awaiting:'Awaiting read',acknowledged:'Completed',nextStep:'Next: ',edit:'Edit answers',editNote:'Saves a correction for the assistant to read; work already performed is not automatically undone.',saveEdit:'Save correction',reviewEdit:'Review and save correction',cancelEdit:'Cancel edit',saving:'Saving answers…',brief:'My requirements',settings:'Question settings',goal:'Goal',confirmed:'Confirmed requirements',open:'Still unclear',empty:'Not yet summarized; add your own notes',apply:'Apply to this task',saveBrief:'Save summary',defaults:'Save as future default',scope:'Changes apply to this task. Switching presets resets the controls below.',preview:'Question style preview',saved:'Saved for this task',defaultSaved:'Saved as future default',saveFailed:'Could not save. Draft retained. Retry; if another window edited it, reload first.',reload:'Reload (discard draft)',saveFirst:'Apply to this task before saving as a default.',working:'Saving…',why:'Why this question: ',preset:'Preset',coverage:'Coverage',depth:'Depth',frequency:'Frequency',diversity:'Diversity',challenge:'Challenge level',questionsPerRound:'Questions per round'}
};
const ux=()=>uiText[locale]||uiText.en;
const presetValues={minimal:{coverage:'focused',depth:'decision',frequency:'blocking',diversity:'direct',challenge:'accept',questionsPerRound:1},balanced:{coverage:'focused',depth:'decision',frequency:'milestones',diversity:'varied',challenge:'probe',questionsPerRound:3},deep:{coverage:'broad',depth:'motivation',frequency:'discovery',diversity:'exploratory',challenge:'challenge',questionsPerRound:3}};
const choices={
 intensity:[['minimal','省心','Minimal'],['balanced','均衡','Balanced'],['deep','深入','Deep']],
 coverage:[['focused','当前关键问题','Key decisions'],['broad','用途、场景、限制等多方面','Broader aspects']],
 depth:[['decision','够做决定即可','Enough for a decision'],['motivation','继续探索原因和真实目的','Explore motivations']],
 frequency:[['blocking','遇到关键缺口才问','Only blockers'],['milestones','阶段节点集中问','At milestones'],['discovery','发现新的重要疑点就问','New meaningful uncertainties']],
 diversity:[['direct','直接提问','Direct'],['varied','结合例子、比较和取舍','Examples and trade-offs'],['exploratory','加入反例与其他可能','Alternatives and counterexamples']],
 challenge:[['accept','尊重偏好，只核实矛盾','Clarify contradictions'],['probe','温和核实假设','Gently probe'],['challenge','主动检验重要假设','Test assumptions']],
 questionsPerRound:[['1','1 题','1'],['2','2 题','2'],['3','3 题','3'],['4','4 题','4'],['5','5 题','5']]
};
const whyEl=document.createElement('p');whyEl.className='why';whyEl.hidden=true;questionEl.after(whyEl);
const reviewEl=document.createElement('p');reviewEl.className='delivery';reviewEl.hidden=true;whyEl.after(reviewEl);
const editActions=document.createElement('div');editActions.className='edit-actions';editActions.hidden=true;footerEl.after(editActions);
const cancelEdit=document.createElement('button');cancelEdit.className='back';cancelEdit.type='button';cancelEdit.addEventListener('click',()=>{if(sending)return;editing=false;sent=true;answers=structuredClone(storedAnswers??answers);page=questions.length;persist();render();void checkStatus();});editActions.append(cancelEdit);
const toolsEl=document.createElement('details');toolsEl.className='tools';toolsEl.hidden=true;
const toolsSummary=document.createElement('summary');toolsEl.append(toolsSummary);
toolsEl.addEventListener('toggle',notifySize);document.querySelector('.card').append(toolsEl);
function panel(){const details=document.createElement('details'),summary=document.createElement('summary'),body=document.createElement('div');body.className='panel';details.append(summary,body);toolsEl.append(details);details.addEventListener('toggle',notifySize);return {details,summary,body};}
const briefPanel=panel(),settingsPanel=panel();
const briefInputs={},selectInputs={},labelNodes={};
function field(parent,key,type){const label=document.createElement('label'),name=document.createElement('span'),input=document.createElement(type);label.className='field';name.dataset.label=key;input.id='aa-'+key;label.append(name,input);parent.append(label);labelNodes[key]=name;return input;}
for(const key of ['goal','confirmed','open']){const input=field(briefPanel.body,key,'textarea');input.maxLength=4000;briefInputs[key]=input;input.addEventListener('input',()=>{if(!contextDirty)briefBase=taskContext?.version??0;contextDirty=true;});}
const briefButtons=document.createElement('div');briefButtons.className='panel-actions';briefPanel.body.append(briefButtons);
const settingsNote=document.createElement('p');settingsNote.className='panel-note';settingsPanel.body.append(settingsNote);
const fields=document.createElement('div');fields.className='fields';settingsPanel.body.append(fields);
for(const key of Object.keys(choices)){const input=field(fields,key==='intensity'?'preset':key,'select');selectInputs[key]=input;input.addEventListener('change',()=>{if(!settingsDirty)settingsBase=taskContext?.version??0;settingsDirty=true;if(key==='intensity')for(const [k,v]of Object.entries(presetValues[input.value]))selectInputs[k].value=String(v);renderPreview();});}
const previewEl=document.createElement('div');previewEl.className='preview';settingsPanel.body.append(previewEl);
const settingsButtons=document.createElement('div');settingsButtons.className='panel-actions';settingsPanel.body.append(settingsButtons);
const briefStatus=document.createElement('p'),settingsStatus=document.createElement('p');for(const el of [briefStatus,settingsStatus]){el.className='panel-note';el.setAttribute('aria-live','polite');}briefPanel.body.append(briefStatus);settingsPanel.body.append(settingsStatus);
function button(parent,handler){const el=document.createElement('button');el.type='button';el.className='back';el.addEventListener('click',handler);parent.append(el);return el;}
const applyBrief=button(briefButtons,()=>saveTask('brief')),reloadBrief=button(briefButtons,()=>reloadTask('brief'));
const applySettings=button(settingsButtons,()=>saveTask('settings')),defaultSettings=button(settingsButtons,saveDefault),reloadSettings=button(settingsButtons,()=>reloadTask('settings'));
let panelBusy=false,contextRequest=null;
function setPanelBusy(value){panelBusy=value;for(const node of toolsEl.querySelectorAll('input,select,textarea,button'))node.disabled=value;}
function renderExtras(){
 const toolsLabel=locale==='zh-CN'?'提问设置与需求摘要':'Question settings and needs summary';toolsSummary.setAttribute('aria-label',toolsLabel);toolsSummary.title=toolsLabel;
 const u=ux();reviewEl.hidden=!editing||page<questions.length||sending;reviewEl.textContent=reviewEl.hidden?'':questions.map((q,i)=>`${q.question}：${choiceText(q,answers[i])}`).join('\n');whyEl.hidden=sent||page>=questions.length||!questions[page]?.reason;whyEl.textContent=whyEl.hidden?'':u.why+questions[page].reason;editActions.hidden=!editing;cancelEdit.textContent=u.cancelEdit;cancelEdit.disabled=sending;
 briefPanel.summary.textContent=u.brief;settingsPanel.summary.textContent=u.settings;settingsNote.textContent=u.scope;
 for(const [key,node]of Object.entries(labelNodes))node.textContent=u[key];
 for(const input of Object.values(briefInputs))input.placeholder=u.empty;
 for(const [key,input]of Object.entries(selectInputs)){const value=input.value;input.replaceChildren(...choices[key].map(([v,zh,en])=>{const option=document.createElement('option');option.value=v;option.textContent=locale==='zh-CN'?zh:en;return option;}));if(value)input.value=value;}
 applyBrief.textContent=u.saveBrief;applySettings.textContent=u.apply;defaultSettings.textContent=u.defaults;reloadBrief.textContent=u.reload;reloadSettings.textContent=u.reload;
 fillContext();updateToolsVisibility();
}
function updateToolsVisibility(){toolsEl.hidden=!taskContext||dismissed||(sent&&!receiptEl.open);}
function fillContext(){
 if(!taskContext)return;
 if(!contextDirty){for(const key of Object.keys(briefInputs))briefInputs[key].value=taskContext.brief?.[key]??'';briefBase=taskContext.version;}
 if(!settingsDirty){const p={...presetValues[taskContext.preferences.intensity],...taskContext.preferences};for(const [key,input]of Object.entries(selectInputs))input.value=String(p[key]);settingsBase=taskContext.version;}
 renderPreview();
}
function receiveContext(context){if(!context?.contextId||taskContext&&taskContext.contextId!==context.contextId)return;if(taskContext&&context.version<taskContext.version)return;taskContext=context;fillContext();updateToolsVisibility();}
function preferenceDraft(){const p={};for(const [key,input]of Object.entries(selectInputs))p[key]=key==='questionsPerRound'?Number(input.value):input.value;return p;}
function renderPreview(){
 if(!taskContext)return;const p=preferenceDraft();const zh=locale==='zh-CN';
 const lines=[ux().preview];
 lines.push(p.coverage==='broad'?(zh?'谁会用？在哪些场景？有什么限制，怎样算成功？':'Who uses it, in which situations, with what limits and success criteria?'):(zh?'当前最影响结果的选择是什么？':'Which current decision changes the outcome most?'));
 if(p.depth==='motivation')lines.push(zh?'这个偏好帮你解决的真正问题是什么？':'What underlying problem does this preference solve?');
 if(p.diversity!=='direct')lines.push(zh?'给你看两个具体例子，比较各自取舍。':'Compare two concrete examples and their trade-offs.');
 if(p.diversity==='exploratory')lines.push(zh?'换一种场景，这个选择还合适吗？还有遗漏的可能吗？':'Would this choice still fit a different scenario? What alternatives are missing?');
 if(p.challenge!=='accept')lines.push(p.challenge==='challenge'?(zh?'如果这项假设不成立，原方案还值得做吗？':'If this assumption is false, is the plan still worthwhile?'):(zh?'这个前提需要先确认一下吗？':'Does this assumption need checking?'));
 lines.push((zh?'频率：':'Frequency: ')+(choices.frequency.find(x=>x[0]===p.frequency)?.[zh?1:2]??''));lines.push(zh?`每轮最多 ${p.questionsPerRound} 题；已回答的不重复问。`:`At most ${p.questionsPerRound} questions per round; no repeated known answers.`);previewEl.textContent=lines.join('\n');notifySize();
}
function startEdit(){if(sending||dismissed||!sent)return;editing=true;editBase=revision;editRequestId=crypto.randomUUID();storedAnswers=structuredClone(answers);sent=false;page=0;savedLocally=false;persist();render();}
async function saveTask(kind){
 if(panelBusy||!taskContext)return;setPanelBusy(true);const status=kind==='brief'?briefStatus:settingsStatus;status.textContent=ux().working;
 const patch=kind==='brief'?{brief:Object.fromEntries(Object.entries(briefInputs).map(([k,v])=>[k,v.value]))}:{preferences:preferenceDraft()};
 const args={action:'update',contextId:taskContext.contextId,expectedVersion:kind==='brief'?briefBase:settingsBase,...patch};
 const signature=JSON.stringify(args);if(contextRequest?.signature!==signature)contextRequest={signature,requestId:crypto.randomUUID()};
 try{
  const result=await request('tools/call',{name:'spellout_context',arguments:{...args,requestId:contextRequest.requestId}});
  if(result?.isError||result?.structuredContent?.contextId!==taskContext.contextId)throw new Error('Save failed');
  // Carry the other panel's draft across only our own next revision. External
  // updates (including a newer result from a retried request) must still conflict.
  if(result.structuredContent.version===args.expectedVersion+1){
   if(kind==='brief'&&settingsBase===args.expectedVersion)settingsBase=result.structuredContent.version;
   if(kind==='settings'&&briefBase===args.expectedVersion)briefBase=result.structuredContent.version;
  }
  if(kind==='brief')contextDirty=false;else settingsDirty=false;receiveContext(result.structuredContent);status.textContent=ux().saved;contextRequest=null;

 }catch{status.textContent=ux().saveFailed;}finally{setPanelBusy(false);notifySize();}
}
async function reloadTask(kind){if(panelBusy||!taskContext)return;setPanelBusy(true);const status=kind==='brief'?briefStatus:settingsStatus;
 try{const result=await request('tools/call',{name:'spellout_context',arguments:{action:'get',contextId:taskContext.contextId}});if(result?.isError||result?.structuredContent?.contextId!==taskContext.contextId)throw new Error();if(kind==='brief')contextDirty=false;else settingsDirty=false;contextRequest=null;receiveContext(result.structuredContent);status.textContent='';}catch{status.textContent=ux().saveFailed;}finally{setPanelBusy(false);notifySize();}}
async function saveDefault(){if(panelBusy||!taskContext)return;if(settingsDirty){settingsStatus.textContent=ux().saveFirst;return;}setPanelBusy(true);
 try{const result=await request('tools/call',{name:'spellout_preferences',arguments:{action:'set',preferences:taskContext.preferences}});if(result?.isError||result?.structuredContent?.scope!=='default')throw new Error();settingsStatus.textContent=ux().defaultSaved;}catch{settingsStatus.textContent=ux().saveFailed;}finally{setPanelBusy(false);notifySize();}}

window.addEventListener('message',event=>{if(event.source!==window.parent)return;const msg=event.data;if(msg?.jsonrpc!=='2.0')return;if(msg.id!==undefined&&pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);msg.error?p.reject(msg.error):p.resolve(msg.result);return;}if(msg.method==='ui/notifications/tool-result')load(msg.params?.structuredContent);if(msg.method==='ui/notifications/host-context-changed')applyHostContext(msg.params);});
load(window.openai?.toolOutput?.structuredContent||window.openai?.toolOutput);
if(window.parent!==window){request('ui/initialize',{appInfo:{name:'spellout',title:'SpellOut',version:'0.5.0'},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'}).then(result=>{applyHostContext(result?.hostContext);window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');bridgeReady=true;void checkStatus();notifySize();}).catch(()=>{});}
if(window.ResizeObserver){const resizeObserver=new ResizeObserver(notifySize);resizeObserver.observe(document.documentElement);resizeObserver.observe(document.body);}
backEl.addEventListener('click',()=>{if(page>0&&!dismissed&&!sent&&!sending){if(page<questions.length&&answers[page].picks.includes(questions[page].options.length))answers[page].custom=freeEl.value;page--;persist();render();}});
nextEl.addEventListener('click',next);
freeEl.addEventListener('input',()=>{if(dismissed||sent||sending)return;if(page<questions.length)answers[page].custom=freeEl.value;statusEl.textContent='';persist();});
freeEl.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.altKey&&!event.isComposing){event.preventDefault();next();}});
freeEl.addEventListener('focus',()=>{if(dismissed||sent||sending||page>=questions.length)return;const item=questions[page],answer=answers[page],index=item.options.length;if(!answer.picks.includes(index)){answer.picks=item.multiple?[...answer.picks,index]:[index];const radio=optionsEl.querySelector(`input[value="${index}"]`);if(radio)radio.checked=true;nextEl.hidden=false;footerEl.hidden=false;persist();}});
</script></body></html>
