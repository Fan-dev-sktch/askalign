<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Try AskAlign · 问齐</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f8f9fb,#181818);--fg:light-dark(#202124,#ececec);--muted:light-dark(#59616b,#a9afb8);--line:light-dark(#d6dce3,#3b4149)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}main{max-width:800px;margin:auto;padding:40px 22px 64px}nav{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}a{color:inherit;text-underline-offset:4px}h1{font-size:clamp(28px,5vw,44px);line-height:1.15;letter-spacing:-.03em;margin:46px 0 16px}p{max-width:68ch}.muted,small{color:var(--muted)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 16px}button,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:9px 12px}button{cursor:pointer}:focus-visible{outline:2px solid #5498e2;outline-offset:3px}iframe{width:100%;border:0;display:block;min-height:32px;height:330px}h2{font-size:18px;margin:30px 0 8px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:14px;margin:0}footer{border-top:1px solid var(--line);margin-top:36px;padding-top:18px;font-size:14px}label{display:flex;align-items:center;gap:7px}@media(max-width:480px){main{padding:22px 16px}.controls{gap:8px}}
</style></head><body><main>
<nav><strong>AskAlign / 问齐 <small>0.4 beta</small></strong><a href="https://github.com/Fan-dev-sktch/askalign">GitHub ↗</a></nav>
<h1 id="headline"></h1><p id="intro"></p><p class="muted" id="scope"></p>
<div class="controls"><label>Language <select id="language"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label><label><span id="theme-label">Theme</span> <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><button id="restart" type="button">Restart</button></div>
<iframe id="card" title="AskAlign interactive question card"></iframe>
<h2 id="answer-label"></h2><pre id="answer" aria-live="polite"></pre>
<footer id="foot"></footer>
</main><script type="module">
const el=id=>document.getElementById(id),frame=el('card');
let locale='en',decision,receipt=null;
const copy={en:{headline:'Clarify before you build.',intro:'Try the actual AskAlign card UI: choose a direction, select more than one requirement, or write your own answer.',scope:'UI demo only. Questions are scripted; no AI runs here. Answers stay in this page’s memory and are cleared on restart. Codex integration requires installation.',restart:'Restart demo',answer:'Your submitted answer',waiting:'Complete the two questions to see the returned text.',foot:'Independent beta project. This page simulates the host message bridge; it does not demonstrate Codex rendering, durable answer recovery or AI interview quality.',questions:[{question:'Who is this feedback page for?',options:[{label:'External users',description:'Collect feedback from people outside your team.'},{label:'Internal team',description:'Collect feedback from your colleagues.'}],recommendedIndex:0},{question:'Which requirements matter? Select one or more.',multiple:true,options:[{label:'Anonymous feedback'},{label:'No login required'},{label:'Follow-up contact'}],recommendedIndex:0}]},'zh-CN':{headline:'先问清楚，再开始做。',intro:'直接试用 AskAlign 的实际卡片界面：点选方向、多选需求，或填写自己的答案。',scope:'仅为界面演示：问题预先编写，不运行 AI。答案只保存在当前页面内存，重试即清除。Codex 集成需要安装插件。',restart:'重新体验',answer:'你提交的答案',waiting:'完成两道问题后，这里会显示回传文本。',foot:'独立测试版项目。本页模拟宿主消息桥接，不代表 Codex 实际渲染、答案持久化恢复或 AI 访谈质量。',questions:[{question:'这个反馈页面主要给谁使用？',options:[{label:'外部用户',description:'收集团队以外用户的反馈。'},{label:'内部团队',description:'收集同事的反馈。'}],recommendedIndex:0},{question:'哪些需求重要？可以多选。',multiple:true,options:[{label:'匿名反馈'},{label:'不要求登录'},{label:'可留下联系方式'}],recommendedIndex:0}]}};
function context(){const dark=el('theme').value==='dark';return{theme:dark?'dark':'light',styles:{variables:{'--font-text-md-size':'16px','--font-text-sm-size':'14px','--color-background-primary':dark?'#181818':'#f8f9fb','--color-background-secondary':dark?'#282b30':'#edf1f5','--color-text-primary':dark?'#ececec':'#202124','--color-text-secondary':dark?'#a9afb8':'#59616b','--color-border-primary':dark?'#3b4149':'#d6dce3'}}};}
function send(data){frame.contentWindow.postMessage({jsonrpc:'2.0',...data},location.origin);}
function restart(){locale=el('language').value;const c=copy[locale];document.documentElement.lang=locale;el('headline').textContent=c.headline;el('intro').textContent=c.intro;el('scope').textContent=c.scope;el('restart').textContent=c.restart;el('answer-label').textContent=c.answer;el('answer').textContent=c.waiting;el('foot').textContent=c.foot;receipt=null;decision={decisionId:crypto.randomUUID(),locale,questions:c.questions};frame.style.height='330px';frame.src='../server/decision-v8.html?demo='+decision.decisionId;}
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;const m=event.data;if(m?.jsonrpc!=='2.0')return;
if(m.method==='ui/notifications/size-changed'){const h=m.params?.height;if(Number.isFinite(h)&&h>0)frame.style.height=Math.min(1200,Math.ceil(h))+'px';return;}
if(m.method==='ui/initialize'){send({id:m.id,result:{hostContext:context()}});send({method:'ui/notifications/tool-result',params:{structuredContent:decision}});return;}
if(m.method==='tools/call'){const a=m.params?.arguments;if(m.params?.name!=='grill_me_submit_answer'||a?.decisionId!==decision.decisionId){send({id:m.id,error:{code:-32602,message:'Unexpected demo submission'}});return;}receipt=a;send({id:m.id,result:{structuredContent:{saved:true,decisionId:decision.decisionId}}});return;}
if(m.method==='ui/message'){if(!receipt){send({id:m.id,error:{code:-32602,message:'No demo receipt'}});return;}el('answer').textContent=(m.params?.content??[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');send({id:m.id,result:{}});}
});
el('restart').addEventListener('click',restart);el('language').addEventListener('change',restart);el('theme').addEventListener('change',()=>{document.documentElement.style.colorScheme=el('theme').value;send({method:'ui/notifications/host-context-changed',params:context()});});document.documentElement.style.colorScheme='dark';restart();
</script></body></html>
